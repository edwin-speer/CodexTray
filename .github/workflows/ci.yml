name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Build application
        run: dotnet build .\src\CodexTray\CodexTray.csproj -c Release

      - name: Build checks
        run: dotnet build .\tests\CodexTray.Tests\CodexTray.Tests.csproj -c Release

      - name: Run checks
        run: dotnet run --project .\tests\CodexTray.Tests\CodexTray.Tests.csproj -c Release --no-build
