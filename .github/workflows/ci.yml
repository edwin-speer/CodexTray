name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Build application
        run: dotnet build .\src\CodexTray\CodexTray.csproj -c Release

      - name: Build checks
        run: dotnet build .\tests\CodexTray.Tests\CodexTray.Tests.csproj -c Release

      - name: Run checks
        run: dotnet run --project .\tests\CodexTray.Tests\CodexTray.Tests.csproj -c Release --no-build
